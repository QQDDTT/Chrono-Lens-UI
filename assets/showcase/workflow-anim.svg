      .pulse-dot { animation: dotPulse 2.4s ease-in-out infinite; }
      @keyframes dashFlow { to { stroke-dashoffset: -28; } }
      @keyframes dotPulse { 0%, 100% { r: 4px; opacity: 0.6; } 50% { r: 6.5px; opacity: 1; } }
    </style>
  </defs>

