<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="cl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#0f1420"/>
      <stop offset="100%" stop-color="#171410"/>
    </linearGradient>
    <linearGradient id="cl-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#fce4a6"/>
      <stop offset="100%" stop-color="#a68238"/>
    </linearGradient>
    <linearGradient id="cl-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="cl-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="0"/>
    </radialGradient>
    <filter id="cl-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      .orbit-cw { transform-origin: 220px 170px; animation: spinCW 28s linear infinite; }
      .orbit-ccw { transform-origin: 220px 170px; animation: spinCCW 20s linear infinite; }
      .pulse-ring { transform-origin: 220px 170px; animation: pulseScale 4.5s ease-in-out infinite; }
      .shield-pulse { transform-origin: 1010px 170px; animation: shieldGlow 3.6s ease-in-out infinite; }
      .scan-line { animation: scanMove 5s ease-in-out infinite; }
      @keyframes spinCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes spinCCW { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
      @keyframes pulseScale { 0%, 100% { transform: scale(0.96); opacity: 0.55; } 50% { transform: scale(1.04); opacity: 0.95; } }
      @keyframes shieldGlow { 0%, 100% { opacity: 0.7; transform: scale(0.98); } 50% { opacity: 1; transform: scale(1.03); } }
      @keyframes scanMove { 0%, 100% { transform: translateY(-48px); opacity: 0.2; } 50% { transform: translateY(48px); opacity: 0.85; } }
    </style>
  </defs>

  <!-- Background & Subtle Gallery Grid -->
  <rect width="1200" height="340" rx="20" fill="url(#cl-bg)" stroke="#a68238" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="220" cy="170" r="160" fill="url(#cl-halo)"/>
  <circle cx="1010" cy="170" r="130" fill="url(#cl-halo)"/>

  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="85" x2="1200" y2="85"/>
    <line x1="0" y1="170" x2="1200" y2="170"/>
    <line x1="0" y1="255" x2="1200" y2="255"/>
    <line x1="380" y1="0" x2="380" y2="340"/>
    <line x1="840" y1="0" x2="840" y2="340"/>
  </g>

  <!-- Left: 360° Celestial Panorama Sphere & Enamel Astrolabe -->
  <g class="pulse-ring">
    <circle cx="220" cy="170" r="108" fill="none" stroke="url(#cl-gold)" stroke-width="1.5" stroke-opacity="0.7"/>
    <ellipse cx="220" cy="170" rx="108" ry="42" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="6 4" stroke-opacity="0.65"/>
    <ellipse cx="220" cy="170" rx="42" ry="108" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="6 4" stroke-opacity="0.65"/>
    <ellipse cx="220" cy="170" rx="82" ry="108" fill="none" stroke="#d4af37" stroke-width="0.9" stroke-opacity="0.4"/>
  </g>
  <g class="orbit-cw">
    <circle cx="220" cy="170" r="124" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="3 9" stroke-opacity="0.8"/>
    <circle cx="220" cy="46" r="4" fill="#fce4a6" filter="url(#cl-glow)"/>
    <circle cx="344" cy="170" r="3.5" fill="#38bdf8" filter="url(#cl-glow)"/>
    <circle cx="220" cy="294" r="4" fill="#fce4a6" filter="url(#cl-glow)"/>
  </g>
  <g class="orbit-ccw">
    <circle cx="220" cy="170" r="72" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="14 8" stroke-opacity="0.7"/>
    <polygon points="220,92 225,102 215,102" fill="#fce4a6"/>
  </g>
  <circle cx="220" cy="170" r="12" fill="url(#cl-gold)" filter="url(#cl-glow)"/>
  <text x="220" y="318" text-anchor="middle" fill="#fce4a6" font-family="Cinzel, Georgia, serif" font-size="11" letter-spacing="3">360° CELESTIAL SPHERE</text>

  <!-- Center: Brand Title, Slogan & 5 Curatorial Domains -->
  <g transform="translate(610, 0)">
    <rect x="-155" y="36" width="310" height="26" rx="13" fill="#d4af37" fill-opacity="0.12" stroke="#d4af37" stroke-opacity="0.45"/>
    <text x="0" y="53" text-anchor="middle" fill="#fce4a6" font-family="Cinzel, Georgia, serif" font-size="11" letter-spacing="3.5">LENS.EVOTENSOR.DEV · GALLERY PWA</text>

    <text x="0" y="116" text-anchor="middle" fill="#ffffff" font-family="Cinzel, 'Noto Serif SC', Georgia, serif" font-size="40" font-weight="600" letter-spacing="8" filter="url(#cl-glow)">CHRONO-LENS</text>
    <text x="0" y="152" text-anchor="middle" fill="#e2e8f0" font-family="'Noto Serif SC', serif" font-size="17" letter-spacing="6">时空之镜 · 记录生活的真实光影与无界全景</text>
    <text x="0" y="182" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" letter-spacing="1.5">360° Equirectangular WebGL · 120fps Slow-Mo Cinema · AES-256-GCM Zero-Leak Vault</text>

    <!-- 5 Domain Pills -->
    <g transform="translate(0, 224)" font-family="'Noto Serif SC', sans-serif" font-size="11.5">
      <g transform="translate(-200, 0)">
        <rect x="-44" y="-14" width="88" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
        <text x="0" y="4" text-anchor="middle" fill="#bae6fd">01 穹·极</text>
      </g>
      <g transform="translate(-100, 0)">
        <rect x="-44" y="-14" width="88" height="28" rx="14" fill="#1e293b" stroke="#c084fc" stroke-opacity="0.6"/>
        <text x="0" y="4" text-anchor="middle" fill="#e9d5ff">02 晨·昏</text>
      </g>
      <g transform="translate(0, 0)">
        <rect x="-44" y="-14" width="88" height="28" rx="14" fill="#1e293b" stroke="#2dd4bf" stroke-opacity="0.6"/>
        <text x="0" y="4" text-anchor="middle" fill="#99f6e4">03 瞬·息</text>
      </g>
      <g transform="translate(100, 0)">
        <rect x="-44" y="-14" width="88" height="28" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-opacity="0.6"/>
        <text x="0" y="4" text-anchor="middle" fill="#fde68a">04 重·温</text>
      </g>
      <g transform="translate(200, 0)">
        <rect x="-44" y="-14" width="88" height="28" rx="14" fill="#1e293b" stroke="#f43f5e" stroke-opacity="0.6"/>
        <text x="0" y="4" text-anchor="middle" fill="#fecdd3">05 重·构</text>
      </g>
    </g>

    <!-- Perforated 35mm Film Gauge Strip -->
    <g transform="translate(-220, 272)" opacity="0.75">
      <line x1="0" y1="0" x2="440" y2="0" stroke="url(#cl-gold)" stroke-width="1"/>
      <line x1="0" y1="22" x2="440" y2="22" stroke="url(#cl-gold)" stroke-width="1"/>
      <text x="220" y="15" text-anchor="middle" fill="#fce4a6" font-family="monospace" font-size="10" letter-spacing="4">35MM / 70MM OPTICAL SPROCKET · WARM ALABASTER #F5F4EF</text>
    </g>
  </g>

  <!-- Right: AES-256-GCM Cryptographic Privacy Shield -->
  <g class="shield-pulse">
    <polygon points="1010,64 1086,96 1086,174 1010,256 934,174 934,96" fill="#0f172a" fill-opacity="0.85" stroke="url(#cl-gold)" stroke-width="2" filter="url(#cl-glow)"/>
    <polygon points="1010,80 1070,106 1070,168 1010,236 950,168 950,106" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4"/>
    <!-- Keyhole / Lock Icon -->
    <rect x="992" y="148" width="36" height="30" rx="5" fill="none" stroke="#fce4a6" stroke-width="2"/>
    <path d="M999,148 V136 A11,11 0 0,1 1021,136 V148" fill="none" stroke="#fce4a6" stroke-width="2"/>
    <circle cx="1010" cy="161" r="3" fill="#38bdf8"/>
    <line x1="1010" y1="164" x2="1010" y2="171" stroke="#38bdf8" stroke-width="2"/>
  </g>
  <line class="scan-line" x1="944" y1="160" x2="1076" y2="160" stroke="#38bdf8" stroke-width="1.5" filter="url(#cl-glow)"/>
  <text x="1010" y="292" text-anchor="middle" fill="#fce4a6" font-family="monospace" font-size="11" letter-spacing="2">AES-256-GCM + PBKDF2</text>
  <text x="1010" y="312" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10.5" letter-spacing="1.5">客户端内存零泄密实时解密</text>
</svg>
