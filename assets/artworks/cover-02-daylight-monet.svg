<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- 晨暮冷暖交融底色 -->
    <radialGradient id="monetBackdrop" cx="60%" cy="70%" r="80%">
      <stop offset="0%" stop-color="#faedd3"/>
      <stop offset="30%" stop-color="#ebd8bf"/>
      <stop offset="65%" stop-color="#99a8b8"/>
      <stop offset="100%" stop-color="#344356"/>
    </radialGradient>

    <!-- 晨曦流金掐丝渐变 -->
    <linearGradient id="auroraGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6dd"/>
      <stop offset="40%" stop-color="#eac278"/>
      <stop offset="80%" stop-color="#bc8c3c"/>
      <stop offset="100%" stop-color="#8a5c1a"/>
    </linearGradient>

    <!-- 莫奈油彩光斑滤镜 -->
    <filter id="oilImpression" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <linearGradient id="topFadeDaylight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 1. 晨昏底基调 -->
  <rect width="800" height="600" fill="url(#monetBackdrop)"/>

  <!-- 2. 印象派《日出·印象》水平油彩斑块堆叠 (莫奈光色解构) -->
  <g filter="url(#oilImpression)" opacity="0.85">
    <!-- 远景晚霞与晨雾色块 -->
    <rect x="60" y="320" width="680" height="34" rx="17" fill="#6d869e" opacity="0.6"/>
    <rect x="120" y="350" width="600" height="42" rx="21" fill="#c49774" opacity="0.55"/>
    <rect x="80" y="390" width="640" height="50" rx="25" fill="#e8ba7a" opacity="0.7"/>
    <rect x="160" y="440" width="520" height="45" rx="22" fill="#d27d53" opacity="0.65"/>
    <rect x="100" y="480" width="620" height="55" rx="27" fill="#2d3d52" opacity="0.8"/>
    <rect x="180" y="525" width="480" height="48" rx="24" fill="#1b2533" opacity="0.9"/>
  </g>

  <!-- 3. 点彩笔触水芒 (Pointillist Light Shimmers) -->
  <g opacity="0.75">
    <ellipse cx="400" cy="410" rx="90" ry="8" fill="#fff5d6"/>
    <ellipse cx="400" cy="430" rx="130" ry="9" fill="#ffdf94"/>
    <ellipse cx="405" cy="455" rx="170" ry="11" fill="#f5b867"/>
    <ellipse cx="395" cy="485" rx="110" ry="9" fill="#e88954"/>
    <ellipse cx="400" cy="515" rx="70" ry="7" fill="#ffd48a"/>
  </g>

  <!-- 4. 35° 真实物理斜射光柱与珐琅金边 (35° Volumetric Beam) -->
  <g transform="rotate(-35, 400, 300)" opacity="0.45">
    <polygon points="150,-100 280,-100 480,700 30,700" fill="url(#auroraGold)" filter="blur(16px)"/>
    <!-- 掐丝金线边缘 -->
    <line x1="150" y1="-100" x2="30" y2="700" stroke="#fce4a6" stroke-width="1.5" stroke-dasharray="8 6"/>
    <line x1="280" y1="-100" x2="480" y2="700" stroke="#fce4a6" stroke-width="1.5" stroke-dasharray="12 8"/>
  </g>

  <!-- 5. 极简艺术绘本风晨日图腾 (Stylized Sol Graphic) -->
  <g transform="translate(400, 360)">
    <!-- 珐琅彩釉日轮 -->
    <circle cx="0" cy="0" r="38" fill="#f79a48" stroke="url(#auroraGold)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="28" fill="#ffcf66"/>
    <circle cx="0" cy="0" r="14" fill="#fff7e6" opacity="0.9"/>

    <!-- 极简放射艺术同心光晕 -->
    <circle cx="0" cy="0" r="62" fill="none" stroke="#fce4a6" stroke-width="1" stroke-dasharray="4 8" opacity="0.6"/>
    <circle cx="0" cy="0" r="92" fill="none" stroke="#fce4a6" stroke-width="0.8" opacity="0.4"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="#fce4a6" stroke-width="0.5" stroke-dasharray="2 12" opacity="0.3"/>
  </g>

  <!-- 6. 顶层向暖素白渐变微漫射（与主页白色区域交融） -->
  <rect width="800" height="240" fill="url(#topFadeDaylight)"/>
</svg>
