<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- 地下恒温金库黑曜石与胡桃木深调 -->
    <radialGradient id="vaultObsidianDark" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#21171a"/>
      <stop offset="38%" stop-color="#140e11"/>
      <stop offset="72%" stop-color="#0b080a"/>
      <stop offset="100%" stop-color="#050406"/>
    </radialGradient>

    <!-- 古法掐丝古铜真金渐变 -->
    <linearGradient id="bronzeGoldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d898"/>
      <stop offset="35%" stop-color="#bf8f47"/>
      <stop offset="70%" stop-color="#7a5420"/>
      <stop offset="100%" stop-color="#d6ab60"/>
    </linearGradient>

    <!-- 深朱砂矿物红釉彩渐变 -->
    <radialGradient id="cinnabarEnamelDark" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#9e2621"/>
      <stop offset="65%" stop-color="#6e1310"/>
      <stop offset="100%" stop-color="#3b0806"/>
    </radialGradient>

    <!-- 暗房安全红光滤镜 -->
    <filter id="darkroomGlowDark" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. 纯净暗调底衬（无顶部白雾遮罩，适配金库深色卡片） -->
  <rect width="800" height="1000" fill="url(#vaultObsidianDark)"/>

  <!-- 2. 暗房微红安全光晕 -->
  <ellipse cx="400" cy="500" rx="310" ry="240" fill="#a8231d" opacity="0.2" filter="blur(42px)"/>

  <!-- 3. 拟真 35mm 胶卷齿孔对称点缀 -->
  <g fill="rgba(214, 171, 96, 0.24)" opacity="0.65">
    <rect x="68" y="300" width="16" height="26" rx="3"/>
    <rect x="68" y="360" width="16" height="26" rx="3"/>
    <rect x="68" y="420" width="16" height="26" rx="3"/>
    <rect x="68" y="480" width="16" height="26" rx="3"/>
    <rect x="68" y="540" width="16" height="26" rx="3"/>
    <rect x="68" y="600" width="16" height="26" rx="3"/>
    <rect x="68" y="660" width="16" height="26" rx="3"/>

    <rect x="716" y="300" width="16" height="26" rx="3"/>
    <rect x="716" y="360" width="16" height="26" rx="3"/>
    <rect x="716" y="420" width="16" height="26" rx="3"/>
    <rect x="716" y="480" width="16" height="26" rx="3"/>
    <rect x="716" y="540" width="16" height="26" rx="3"/>
    <rect x="716" y="600" width="16" height="26" rx="3"/>
    <rect x="716" y="660" width="16" height="26" rx="3"/>
  </g>

  <!-- 4. 景泰蓝掐丝古铜时光印章 (居中于 800x1000 画幅) -->
  <g transform="translate(400, 500) scale(1.22)" filter="url(#darkroomGlowDark)">
    <polygon points="-110,-110 -60,-130 60,-130 110,-110 130,-60 130,60 110,110 60,130 -60,130 -110,110 -130,60 -130,-60" fill="none" stroke="url(#bronzeGoldDark)" stroke-width="2" opacity="0.88"/>
    <circle cx="0" cy="0" r="105" fill="none" stroke="#d6ab60" stroke-width="0.9" stroke-dasharray="4 6" opacity="0.62"/>

    <circle cx="0" cy="0" r="88" fill="url(#cinnabarEnamelDark)" stroke="url(#bronzeGoldDark)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="76" fill="none" stroke="#f5d898" stroke-width="0.8" opacity="0.52"/>

    <circle cx="0" cy="0" r="58" fill="none" stroke="url(#bronzeGoldDark)" stroke-width="1.2" stroke-dasharray="8 4"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#f5d898" stroke-width="0.9" opacity="0.72"/>

    <path d="M-18,-14 A18,18 0 0,1 18,-14 L18,2 L-18,2 Z" fill="none" stroke="url(#bronzeGoldDark)" stroke-width="2.5"/>
    <rect x="-24" y="0" width="48" height="34" rx="6" fill="#140b0d" stroke="url(#bronzeGoldDark)" stroke-width="1.8"/>
    <circle cx="0" cy="13" r="5" fill="#f5d898"/>
    <polygon points="-2,16 2,16 3,24 -3,24" fill="#f5d898"/>
  </g>

  <!-- 5. 时光刻度防伪微标 -->
  <g transform="translate(400, 500)" fill="#d6ab60" opacity="0.78" font-family="'Cinzel', serif" font-size="11" letter-spacing="4" text-anchor="middle">
    <text y="-190">· ERA 2024 — 2026 ·</text>
    <text y="202">AUTHENTIC FILM VAULT</text>
  </g>
</svg>

