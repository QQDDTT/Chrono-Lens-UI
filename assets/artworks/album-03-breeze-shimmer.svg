<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 418" width="100%" height="100%">
  <!-- 2.39:1 变形宽银幕画幅 (1000 x 418) -->
  <defs>
    <!-- 暗室黑曜与深靛蓝夜光底釉 -->
    <linearGradient id="cinemaDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="40%" stop-color="#0f1624"/>
      <stop offset="75%" stop-color="#19283d"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>

    <!-- 微风流金流动线条 -->
    <linearGradient id="windGoldGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ffd585" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#d4af37" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#e89d2c" stop-opacity="0"/>
    </linearGradient>

    <!-- 树冠点彩金光微斑 -->
    <radialGradient id="canopyPointillism" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8db" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#fcd581" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0f1624" stop-opacity="0"/>
    </radialGradient>

    <!-- 运动柔化微滤镜 -->
    <filter id="windMotion" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3 0.8" result="motionBlur"/>
      <feComposite in="SourceGraphic" in2="motionBlur" operator="over"/>
    </filter>
  </defs>

  <!-- 2.39:1 背景底板 -->
  <rect width="1000" height="418" fill="url(#cinemaDarkBg)"/>

  <!-- 透纳式流光与修拉点彩光斑群 -->
  <g opacity="0.7" filter="url(#windMotion)">
    <!-- 逆光大光晕 -->
    <circle cx="680" cy="180" r="160" fill="url(#canopyPointillism)"/>
    <circle cx="340" cy="220" r="120" fill="url(#canopyPointillism)" opacity="0.6"/>

    <!-- 点彩金色光斑 (Pointillist Shimmers) -->
    <circle cx="210" cy="140" r="18" fill="#ffeaa7" opacity="0.4"/>
    <circle cx="280" cy="190" r="24" fill="#ffd585" opacity="0.5"/>
    <circle cx="390" cy="160" r="32" fill="#ffeaa7" opacity="0.6"/>
    <circle cx="480" cy="240" r="20" fill="#ffd585" opacity="0.45"/>
    <circle cx="560" cy="150" r="28" fill="#fff8db" opacity="0.65"/>
    <circle cx="640" cy="260" r="22" fill="#ffd585" opacity="0.5"/>
    <circle cx="750" cy="170" r="36" fill="#ffeaa7" opacity="0.7"/>
    <circle cx="820" cy="230" r="26" fill="#fcd581" opacity="0.5"/>
  </g>

  <!-- 拂过发梢的流线微风金丝 (Wind Streams) -->
  <g fill="none" stroke="url(#windGoldGrad)" stroke-linecap="round">
    <path d="M-50,210 C200,120 400,280 700,160 C850,100 950,190 1050,170" stroke-width="2.2" opacity="0.85"/>
    <path d="M-50,240 C180,160 380,310 680,190 C830,130 940,220 1050,200" stroke-width="1.6" opacity="0.75"/>
    <path d="M-50,170 C240,90 440,250 740,130 C890,70 980,160 1050,140" stroke-width="1.4" opacity="0.6"/>
    <path d="M-50,280 C160,200 360,350 660,230 C810,170 920,260 1050,240" stroke-width="1.2" opacity="0.5"/>
    <path d="M-50,130 C280,50 480,210 780,90 C920,30 1010,120 1050,100" stroke-width="1.8" opacity="0.65"/>
  </g>

  <!-- 2.39:1 航空铝边框与微光金角 -->
  <rect x="12" y="12" width="976" height="394" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" rx="10"/>
  <rect x="18" y="18" width="964" height="382" fill="none" stroke="url(#windGoldGrad)" stroke-width="0.6" stroke-dasharray="8,12" opacity="0.4"/>

  <!-- 居中艺术题记与电影标识 -->
  <g transform="translate(500, 340)" text-anchor="middle">
    <text font-family="'Cinzel', 'Times New Roman', serif" font-size="12" fill="#ffd585" letter-spacing="0.36em" opacity="0.85">GENTLE BREEZE &amp; LIGHT · 120 FPS</text>
    <text font-family="'Noto Serif SC', serif" font-size="16" font-weight="300" fill="#ffffff" letter-spacing="0.22em" y="24" opacity="0.95">风拂发梢 · 林间轻语与流光</text>
  </g>
</svg>
