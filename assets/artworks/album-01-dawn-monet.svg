<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- 莫奈印象派晨雾与日出油彩基底 -->
    <linearGradient id="monetDawnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="30%" stop-color="#4a6572"/>
      <stop offset="65%" stop-color="#8ba8b7"/>
      <stop offset="85%" stop-color="#f9d5a7"/>
      <stop offset="100%" stop-color="#ffb88c"/>
    </linearGradient>

    <!-- 晨曦 35° 斜射丁达尔光束 -->
    <linearGradient id="lightShaft" x1="0%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#fff8db" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#fcd581" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4a6572" stop-opacity="0"/>
    </linearGradient>

    <!-- 晨光核心金晕 -->
    <radialGradient id="sunDawnBloom" cx="35%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#ffeaa7" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#fab1a0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2c3e50" stop-opacity="0"/>
    </radialGradient>

    <!-- 印象派油彩短笔触图案 -->
    <filter id="canvasImpression" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- 艺术背景底板 -->
  <rect width="800" height="1000" fill="url(#monetDawnBg)"/>

  <!-- 莫奈印象派色块层叠（模拟日出水汽与林间雾气） -->
  <g filter="url(#canvasImpression)">
    <!-- 远山冷蓝薄雾 -->
    <path d="M-50,420 Q180,360 400,410 T850,380 L850,700 L-50,700 Z" fill="#34495e" opacity="0.45"/>
    <path d="M-50,480 Q250,430 520,490 T850,460 L850,800 L-50,800 Z" fill="#4b6584" opacity="0.4"/>
    
    <!-- 林间树影抽象交错色斑 -->
    <ellipse cx="220" cy="540" rx="90" ry="160" fill="#2c3e50" opacity="0.6"/>
    <ellipse cx="280" cy="510" rx="70" ry="140" fill="#3d566e" opacity="0.5"/>
    <ellipse cx="620" cy="560" rx="110" ry="180" fill="#2d3748" opacity="0.55"/>
    <ellipse cx="560" cy="530" rx="80" ry="150" fill="#4a5568" opacity="0.45"/>

    <!-- 晨光倒影与露水水光跳跃短笔触 (Impressionist Dabs) -->
    <g fill="#ffeaa7" opacity="0.75">
      <rect x="180" y="680" width="80" height="12" rx="6"/>
      <rect x="290" y="665" width="110" height="14" rx="7"/>
      <rect x="220" y="710" width="95" height="10" rx="5"/>
      <rect x="360" y="700" width="130" height="15" rx="7.5"/>
      <rect x="270" y="740" width="140" height="12" rx="6"/>
      <rect x="420" y="730" width="100" height="14" rx="7"/>
      <rect x="320" y="780" width="160" height="16" rx="8"/>
      <rect x="480" y="765" width="110" height="12" rx="6"/>
      <rect x="240" y="820" width="130" height="14" rx="7"/>
      <rect x="390" y="810" width="150" height="15" rx="7.5"/>
      <rect x="300" y="860" width="180" height="14" rx="7"/>
      <rect x="490" y="845" width="90" height="11" rx="5.5"/>
    </g>
  </g>

  <!-- 35° 斜射丁达尔光束 -->
  <polygon points="120,-40 380,-40 760,1040 400,1040" fill="url(#lightShaft)"/>
  <polygon points="260,-40 480,-40 850,900 580,900" fill="url(#lightShaft)" opacity="0.6"/>

  <!-- 晨曦太阳核心光晕 -->
  <circle cx="280" cy="240" r="220" fill="url(#sunDawnBloom)"/>

  <!-- 艺术纸边框与金线题字 -->
  <rect x="28" y="28" width="744" height="944" fill="none" stroke="rgba(255,245,215,0.4)" stroke-width="1.2"/>
  <rect x="36" y="36" width="728" height="928" fill="none" stroke="rgba(255,245,215,0.25)" stroke-width="0.6" stroke-dasharray="4,6"/>

  <!-- 顶部题记 -->
  <g transform="translate(400, 95)" text-anchor="middle">
    <text font-family="'Cinzel', 'Times New Roman', serif" font-size="14" fill="#fff5d7" letter-spacing="0.34em" opacity="0.9">DAWN MIST &amp; WINDOW LIGHT</text>
    <text font-family="'Noto Serif SC', serif" font-size="20" font-weight="300" fill="#ffffff" letter-spacing="0.22em" y="32" opacity="0.95">第一道晨光 · 林间薄雾与窗扉</text>
    <line x1="-80" y1="52" x2="80" y2="52" stroke="rgba(255,245,215,0.5)" stroke-width="0.8"/>
  </g>
</svg>
