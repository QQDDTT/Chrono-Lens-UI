<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- 先锋暗灰实验底衬 -->
    <radialGradient id="studioGrayDark" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#1c212c"/>
      <stop offset="38%" stop-color="#11151d"/>
      <stop offset="72%" stop-color="#0a0c11"/>
      <stop offset="100%" stop-color="#050609"/>
    </radialGradient>

    <!-- 冷青赛博光谱渐变 -->
    <linearGradient id="cyanSpectrumDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70ffff"/>
      <stop offset="50%" stop-color="#00c8e6"/>
      <stop offset="100%" stop-color="#006b99"/>
    </linearGradient>

    <!-- 品红波普光谱渐变 -->
    <linearGradient id="magentaSpectrumDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6699"/>
      <stop offset="50%" stop-color="#e6005c"/>
      <stop offset="100%" stop-color="#800033"/>
    </linearGradient>

    <!-- 冷钛镀铬分割轴线渐变 -->
    <linearGradient id="chromeAxisDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#e2e8f0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>

    <filter id="neonSpillDark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. 纯净暗调底衬（无顶部白雾遮罩，适配工作室暗色展牌） -->
  <rect width="800" height="1000" fill="url(#studioGrayDark)"/>

  <!-- 2. 表现主义与波普艺术几何解构色域 (居中于 800x1000 画幅) -->
  <g transform="translate(400, 500) scale(1.18)" filter="url(#neonSpillDark)">
    <path d="M-220,-90 L-12,-90 L-12,130 L-220,130 Z" fill="url(#magentaSpectrumDark)" opacity="0.84"/>
    <rect x="-240" y="-138" width="128" height="34" fill="#ff0055" opacity="0.62"/>

    <path d="M12,-130 L220,-130 L220,90 L12,90 Z" fill="url(#cyanSpectrumDark)" opacity="0.84"/>
    <rect x="122" y="104" width="118" height="44" fill="#00d0ff" opacity="0.62"/>

    <!-- 高温烧结冰裂纹开片珐琅几何折线 -->
    <g stroke="#ffffff" stroke-width="1.3" opacity="0.76" fill="none">
      <path d="M-180,-65 L-140,-35 L-110,-55 L-70,0 L-40,-20 L-12,10"/>
      <path d="M-160,25 L-120,45 L-90,15 L-60,55 L-30,35 L-12,75"/>
      <path d="M30,-95 L70,-75 L90,-105 L140,-65 L180,-85"/>
      <path d="M40,-35 L80,-15 L120,-45 L160,0 L190,-20"/>
    </g>

    <!-- 纯净光学棱镜中轴线（不含伪交互箭头手柄） -->
    <line x1="0" y1="-195" x2="0" y2="195" stroke="url(#chromeAxisDark)" stroke-width="2"/>
  </g>

  <!-- 3. 光学标尺微刻度 -->
  <g stroke="#94a3b8" stroke-width="0.9" opacity="0.46" fill="none">
    <line x1="120" y1="250" x2="680" y2="250"/>
    <line x1="120" y1="750" x2="680" y2="750"/>
    <circle cx="200" cy="250" r="3" fill="#94a3b8"/>
    <circle cx="400" cy="250" r="3" fill="#94a3b8"/>
    <circle cx="600" cy="250" r="3" fill="#94a3b8"/>
  </g>

  <g transform="translate(400, 800)" fill="#cbd5e1" opacity="0.82" font-family="'Space Mono', monospace" font-size="11" letter-spacing="4" text-anchor="middle">
    <text>SPECTRAL RECONSTRUCTION</text>
  </g>
</svg>

