<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" fill="none">
  <defs>
    <!-- 全景天球穹顶光弧渐变 -->
    <radialGradient id="sphereAura" cx="50%" cy="85%" r="75%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.22" />
      <stop offset="35%" stop-color="#4f759b" stop-opacity="0.12" />
      <stop offset="70%" stop-color="#182333" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="horizonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0" />
      <stop offset="30%" stop-color="#f5e1a4" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#f5e1a4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="arcStroke" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#c59b27" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#718ba8" stop-opacity="0.2" />
    </linearGradient>

    <filter id="panoSoftBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. 背景底部漫反射光晕 -->
  <rect x="0" y="0" width="680" height="340" fill="url(#sphereAura)" />

  <!-- 2. 360° 空间视界天球经纬拱顶 (Celestial Dome) -->
  <g transform="translate(340, 260)">
    <!-- 空间地平线 -->
    <line x1="-280" y1="0" x2="280" y2="0" stroke="url(#horizonGlow)" stroke-width="1.2" opacity="0.6" />
    <line x1="-180" y1="0" x2="180" y2="0" stroke="#ffffff" stroke-width="1.8" filter="url(#panoSoftBlur)" opacity="0.8" />

    <!-- 空间天球穹顶弧圈 -->
    <path d="M -220,0 A 220,130 0 0,1 220,0" stroke="url(#arcStroke)" stroke-width="1.2" fill="none" opacity="0.75" />
    <path d="M -160,0 A 160,95 0 0,1 160,0" stroke="url(#arcStroke)" stroke-width="0.8" stroke-dasharray="4 6" fill="none" opacity="0.5" />
    <path d="M -100,0 A 100,60 0 0,1 100,0" stroke="url(#arcStroke)" stroke-width="0.6" stroke-dasharray="2 4" fill="none" opacity="0.4" />

    <!-- 视轴纵线与空间经线 -->
    <path d="M -150,0 Q -80,-110 0,-130 Q 80,-110 150,0" stroke="#8fa6be" stroke-width="0.6" stroke-dasharray="2 5" fill="none" opacity="0.45" />
    <path d="M -60,0 Q -30,-125 0,-130 Q 30,-125 60,0" stroke="#c59b27" stroke-width="0.8" stroke-dasharray="3 4" fill="none" opacity="0.55" />
    
    <!-- 天顶中心视心 (Zenith Point) -->
    <circle cx="0" cy="-130" r="3.5" fill="#fce4a6" filter="url(#panoSoftBlur)" />
    <circle cx="0" cy="-130" r="1.5" fill="#ffffff" />
    
    <!-- 悬浮光标 -->
    <circle cx="-110" cy="-70" r="1.5" fill="#d4af37" opacity="0.7" />
    <circle cx="130" cy="-55" r="1.8" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- 3. 底部专属题记 -->
  <g transform="translate(340, 310)" text-anchor="middle">
    <text font-family="'Cormorant Garamond', serif" font-size="10" letter-spacing="0.28em" fill="#a68238" opacity="0.75">360° CELESTIAL HORIZON</text>
    <text y="14" font-family="'Noto Serif SC', serif" font-size="9" letter-spacing="0.14em" fill="#6c7482" opacity="0.6">穹 · 极 全景空间视界</text>
  </g>
</svg>
