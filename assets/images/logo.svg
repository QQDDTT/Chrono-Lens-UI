<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- 典雅香槟金与黑曜石渐变 -->
    <linearGradient id="chronoRing" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#2a2e39" />
      <stop offset="45%" stop-color="#5a6070" />
      <stop offset="100%" stop-color="#14171f" />
    </linearGradient>
    <linearGradient id="goldIris" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#c59b27" />
      <stop offset="100%" stop-color="#9a7516" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 外环：时间之轮 (Chrono: 纤细时空刻度环) -->
  <circle cx="60" cy="60" r="50" stroke="url(#chronoRing)" stroke-width="1.2" stroke-dasharray="2 6" opacity="0.45" />

  <!-- 主体透镜外弧：时空双交切弧 (Dual Spherical Arcs) -->
  <path d="M 60 16 A 44 44 0 0 1 104 60 A 44 44 0 0 1 60 104" stroke="url(#chronoRing)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 60 16 A 44 44 0 0 0 16 60 A 44 44 0 0 0 60 104" stroke="url(#chronoRing)" stroke-width="1" stroke-dasharray="8 4" stroke-linecap="round" opacity="0.6" />

  <!-- 内部光学光圈弧片 (Aperture Iris Blading) -->
  <path d="M 40 38 Q 60 48 68 34" stroke="url(#goldIris)" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 78 44 Q 72 66 86 70" stroke="url(#goldIris)" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 76 82 Q 56 74 48 86" stroke="url(#goldIris)" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 38 72 Q 44 52 30 48" stroke="url(#goldIris)" stroke-width="1.8" stroke-linecap="round" />

  <!-- 核心视心：物理真实光学焦点 (Optical Singularity) -->
  <circle cx="60" cy="60" r="4.5" fill="url(#goldIris)" filter="url(#softGlow)" />
  <circle cx="60" cy="60" r="1.5" fill="#ffffff" />
</svg>
