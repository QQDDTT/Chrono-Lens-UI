<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>MODULE 05 · 重·构 | 先锋艺术实验室 - Chrono-Lens</title>
  <meta name="description" content="Chrono-Lens 重·构 先锋艺术实验室：母版溯源与双向无级擦除对比滑动条、赛博光谱色调裂变与复古银盐重塑。" />

  <!-- 移动端全屏与安全区适配 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="重·构 实验" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0e1014" />

  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="apple-touch-icon" href="./favicon.svg" />
  <link rel="manifest" href="./manifest.json" />
  <script src="./assets/soundscape.js"></script>

  <!-- 艺术字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Noto+Serif+SC:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       Chrono-Lens 子模块 05 · 重·构 专属先锋艺术实验室设计系统
       - 先锋暗调实验灰（#0e1014）+ 冷钛合金光芒
       - 双向无级擦除对比滑动条 (Interactive Before/After Split Slider)
       - 表现主义波普几何光谱与裂变珐琅微装裱
       ========================================================================== */
    :root {
      --bg-dark: #0e1014;
      --bg-card: #14171d;
      --text-pure: #ffffff;
      --text-sub: rgba(255, 255, 255, 0.80);
      --text-muted: rgba(255, 255, 255, 0.58);
      --glass-bg: rgba(20, 24, 32, 0.78);
      --glass-border: rgba(255, 255, 255, 0.12);
      --accent-neon-cyan: #38bdf8;
      --accent-neon-pink: #f43f5e;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --font-serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
      --font-en: "Cinzel", "Times New Roman", serif;
      --font-mono: "Space Mono", "Courier New", monospace;
      --ease-cinematic: cubic-bezier(0.16, 1, 0.3, 1);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      transition-property: none;
    }

    h1, h2, h3 {
      text-wrap: balance;
    }

    p {
      text-wrap: pretty;
      line-break: strict;
    }

    .project-count-tag {
      font-variant-numeric: tabular-nums;
    }

    *:focus {
      outline: none;
    }

    *:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px var(--accent-neon-cyan), 0 0 16px var(--accent-glow);
      border-radius: 4px;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background-color: var(--bg-dark);
      background-image:
        radial-gradient(circle at 75% 15%, rgba(56, 189, 248, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 25% 65%, rgba(244, 63, 94, 0.06) 0%, transparent 60%);
      color: var(--text-pure);
      font-family: var(--font-serif);
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 标签与按键防折行 */
    .hud-icon-btn, .studio-btn, .filter-chip, .slider-handle {
      white-space: nowrap;
      flex-shrink: 0;
    }

    @keyframes spatial-unfold {
      0% {
        opacity: 0;
        transform: scale(1.05);
        filter: blur(14px);
      }
      100% {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
      }
    }

    .studio-stage {
      position: relative;
      width: 100%;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: spatial-unfold 0.8s var(--ease-cinematic) forwards;
      z-index: 2;
    }

    /* 顶部悬浮毛玻璃导览岛 */
    .hud-top-bar {
      position: fixed;
      top: max(16px, calc(var(--safe-top) + 12px));
      left: max(16px, calc(var(--safe-left) + 16px));
      right: max(16px, calc(var(--safe-right) + 16px));
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .hud-icon-btn {
      pointer-events: auto;
      position: relative;
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      border-radius: 50%;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-pure);
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.3s var(--ease-cinematic), border-color 0.3s var(--ease-cinematic), box-shadow 0.3s var(--ease-cinematic), background-color 0.3s var(--ease-cinematic);
    }

    .hud-icon-btn:hover {
      border-color: var(--accent-neon-cyan);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .hud-center-title {
      font-family: var(--font-en);
      letter-spacing: 0.28em;
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* 页面主体内容容器 */
    .content-container {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: calc(var(--safe-top) + 68px) 24px calc(var(--safe-bottom) + 20px) 24px;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    .view-section {
      width: 100%;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: opacity 0.5s var(--ease-cinematic), transform 0.5s var(--ease-cinematic);
    }

    .view-hidden {
      display: none !important;
      opacity: 0;
      pointer-events: none;
    }

    /* 策展人题记 */
    .curator-header {
      text-align: center;
      margin-bottom: 24px;
      max-width: 680px;
      margin-left: auto;
      margin-right: auto;
      flex-shrink: 0;
    }

    .curator-title {
      font-size: clamp(24px, 3.6vw, 34px);
      font-weight: 300;
      letter-spacing: 0.20em;
      margin-bottom: 10px;
      color: var(--text-pure);
    }

    .curator-quote {
      font-size: 13px;
      line-height: 1.75;
      color: var(--text-sub);
      font-weight: 300;
      letter-spacing: 0.08em;
      padding: 0 12px;
    }

    .curator-quote::before, .curator-quote::after {
      content: "";
      display: block;
      width: 32px;
      height: 1px;
      background: var(--accent-neon-cyan);
      opacity: 0.38;
      margin: 10px auto;
    }

    /* 实验项目网格 */
    .project-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 28px;
      justify-content: center;
      margin-top: 8px;
      width: 100%;
    }

    .project-card {
      background: var(--bg-card);
      border-radius: 14px;
      padding: 16px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.5s var(--ease-cinematic), border-color 0.5s var(--ease-cinematic), box-shadow 0.5s var(--ease-cinematic);
    }

    .project-card:hover {
      transform: translateY(-6px) scale(1.01);
      border-color: var(--accent-neon-cyan);
      box-shadow: 0 18px 48px var(--accent-glow);
    }

    .project-cover-box {
      width: 100%;
      aspect-ratio: 4 / 5;
      max-height: 44dvh;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      background: #080a0e;
    }

    .project-cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.7s var(--ease-cinematic);
    }

    .project-card:hover .project-cover-img {
      transform: scale(1.03);
    }

    .project-badge-top {
      position: absolute;
      top: 14px;
      left: 14px;
      padding: 4px 10px;
      border-radius: 4px;
      background: rgba(14, 16, 20, 0.88);
      backdrop-filter: blur(8px);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.15em;
      color: #7dd3fc;
      border: 0.5px solid rgba(125, 211, 252, 0.42);
    }

    .project-count-tag {
      position: absolute;
      top: 14px;
      right: 14px;
      padding: 4px 10px;
      border-radius: 4px;
      background: rgba(14, 16, 20, 0.88);
      backdrop-filter: blur(8px);
      font-family: var(--font-mono);
      font-size: 10px;
      color: #ffffff;
      border: 0.5px solid rgba(255, 255, 255, 0.22);
    }

    .project-info {
      padding: 16px 6px 4px 6px;
    }

    .project-title {
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
      color: var(--text-pure);
    }

    .project-curation {
      font-size: 13px;
      line-height: 1.68;
      color: var(--text-sub);
      font-weight: 300;
    }

    /* 移动端横向滑动指示锚点 (44x44px 触控热区) */
    .studio-dots-nav {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-top: 8px;
      flex-shrink: 0;
    }

    .studio-dot-btn {
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      background: transparent;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .studio-dot-core {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.24);
      transition: transform 0.35s var(--ease-cinematic), background-color 0.35s var(--ease-cinematic);
    }

    .studio-dot-btn.is-active .studio-dot-core {
      background: var(--accent-neon-cyan);
      transform: scaleX(2.4);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    /* ==========================================================================
       Level 3 先锋实验项目展陈 (Studio Project Showcase)
       ========================================================================== */
    .sub-nav-bar {
      width: 100%;
      max-width: 860px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px auto;
      flex-shrink: 0;
    }

    /* 双向无级擦除对比滑动视窗 (Split Slider Container) */
    .slider-frame-wrapper {
      position: relative;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      border-radius: 10px;
      overflow: hidden;
      border: 1.5px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(56, 189, 248, 0.15);
      background: #06080c;
      flex-shrink: 1;
      min-height: 0;
    }

    .split-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      max-height: 48dvh;
      overflow: hidden;
      user-select: none;
      touch-action: none;
      cursor: ew-resize;
    }

    /* After 图像 (特化层，全铺底层) */
    .img-after {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(1.35) contrast(1.1);
    }

    /* Before 图像 (母版层，全铺对齐并使用 clip-path 裁切，像素级零形变) */
    .before-clip-box {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 5;
      clip-path: inset(0 50% 0 0);
      will-change: clip-path;
    }

    .img-before {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 0.5px 冷银光学分割准线 */
    .split-divider-line {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 2px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.75);
      z-index: 15;
      pointer-events: none;
      will-change: transform;
    }

    /* 分割线手柄按钮 (44x44px 触控与键盘无障碍热区) */
    .slider-handle {
      position: absolute;
      top: 50%;
      left: 0;
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      border-radius: 50%;
      background: #ffffff;
      border: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      cursor: ew-resize;
      color: #0e1014;
      padding: 0;
      will-change: transform;
    }

    /* 左右状态小标识 (高对比度 >= 8:1) */
    .badge-before {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 4px 10px;
      border-radius: 4px;
      background: rgba(10, 14, 22, 0.84);
      border: 1px solid rgba(255, 255, 255, 0.22);
      font-family: var(--font-mono);
      font-size: 11px;
      color: #ffffff;
      z-index: 10;
      pointer-events: none;
    }

    .badge-after {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 4px 10px;
      border-radius: 4px;
      background: rgba(10, 14, 22, 0.86);
      border: 1px solid rgba(125, 211, 252, 0.45);
      font-family: var(--font-mono);
      font-size: 11px;
      color: #7dd3fc;
      z-index: 10;
      pointer-events: none;
    }

    /* 参数岛 */
    .technique-island {
      margin: 14px auto 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px 14px;
      padding: 8px 20px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 9999px;
      font-size: 11px;
      color: var(--text-sub);
      flex-shrink: 0;
      max-width: 100%;
    }

    /* 底部作品导航 */
    .project-track {
      margin: 14px auto 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .work-thumb {
      width: 68px;
      height: 52px;
      min-width: 60px;
      min-height: 48px;
      border-radius: 6px;
      overflow: hidden;
      border: 1.5px solid transparent;
      background: #080a0e;
      padding: 0;
      opacity: 0.52;
      cursor: pointer;
      transition: transform 0.3s var(--ease-cinematic), opacity 0.3s var(--ease-cinematic), border-color 0.3s var(--ease-cinematic), box-shadow 0.3s var(--ease-cinematic);
    }

    .work-thumb.active {
      opacity: 1;
      border-color: var(--accent-neon-cyan);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .work-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @media (max-width: 768px) {
      .content-container {
        padding: calc(var(--safe-top) + 64px) 18px calc(var(--safe-bottom) + 12px) 18px;
      }

      .curator-header {
        margin-bottom: 14px;
      }

      .curator-title {
        font-size: 24px;
        margin-bottom: 6px;
      }

      .curator-quote {
        font-size: 12.5px;
        line-height: 1.65;
      }

      .curator-quote::before, .curator-quote::after {
        margin: 8px auto;
      }

      .project-grid {
        display: flex;
        flex-wrap: nowrap;
        justify-content: flex-start;
        overflow-x: auto;
        gap: 16px;
        margin-top: 4px;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .project-grid::-webkit-scrollbar {
        display: none;
      }

      .project-card {
        flex: 0 0 100%;
        max-width: 100%;
        scroll-snap-align: center;
        padding: 14px;
      }

      .project-card:hover {
        transform: none;
      }

      .project-cover-box {
        aspect-ratio: 4 / 4.2;
        max-height: 40dvh;
      }

      .project-info {
        padding: 12px 4px 4px 4px;
      }

      .project-title {
        font-size: 16px;
        margin-bottom: 6px;
      }

      .project-curation {
        font-size: 12.5px;
        line-height: 1.62;
      }

      .studio-dots-nav {
        display: flex;
      }

      .split-viewport {
        aspect-ratio: 4 / 3.4;
        max-height: 44dvh;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- 顶部悬浮毛玻璃导览岛 (左右对称 44x44px Ghost Glyphs) -->
  <header class="hud-top-bar">
    <a href="./index.html" class="hud-icon-btn" id="btnStudioTopBack" title="返回" aria-label="返回">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>
    </a>

    <div class="hud-center-title">
      MODULE 05 · RECONSTRUCT
    </div>

    <div style="display: flex; align-items: center;">
      <button class="hud-icon-btn" id="btnStudioSound" title="先锋声景" aria-label="先锋声景">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
        </svg>
        <span id="soundDotStudio" style="position: absolute; top: 6px; right: 6px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent-neon-cyan, #38bdf8); opacity: 0; box-shadow: 0 0 6px var(--accent-neon-cyan); transition: opacity 0.3s;"></span>
      </button>
    </div>
  </header>

  <!-- 场景主体 -->
  <main class="studio-stage">
    <div class="content-container">

      <!-- ==========================================================================
           视图 1：Level 2【重·构】先锋实验大厅 (Studio Salon View)
           ========================================================================== -->
      <section class="view-section" id="studioSalonView">
        <div class="curator-header">
          <h1 class="curator-title">重塑与先锋</h1>
          <p class="curator-quote">
            在真实之上，以光影与算法重构全新的视界。
          </p>
        </div>

        <div class="project-grid" id="projectGrid">
          <!-- 动态注入实验单元卡片 -->
        </div>

        <div class="studio-dots-nav" id="studioDotsNav" aria-label="实验单元切换">
          <!-- 动态注入 44x44px 指示锚点 -->
        </div>
      </section>

      <!-- ==========================================================================
           视图 2：Level 3 先锋实验项目展陈 (Studio Project Showcase)
           ========================================================================== -->
      <section class="view-section view-hidden" id="showcaseView">
        <div class="sub-nav-bar">
          <span style="font-size: 13px; letter-spacing: 0.14em; color: var(--text-sub);" id="activeProjectTitle"></span>
        </div>

        <!-- 双向无级擦除对比滑动条 -->
        <div class="slider-frame-wrapper">
          <div class="split-viewport" id="splitViewport">
            <!-- 底层：After 特化版 -->
            <img src="" alt="" class="img-after" id="imgAfter" />

            <!-- 上层裁剪框：Before 母版 -->
            <div class="before-clip-box" id="beforeClipBox">
              <img src="" alt="" class="img-before" id="imgBefore" />
            </div>

            <!-- 冷银分割准线 -->
            <div class="split-divider-line" id="splitDividerLine" aria-hidden="true"></div>

            <!-- 分割线手柄 -->
            <button type="button" class="slider-handle" id="sliderHandle" aria-label="左右拖动对比母版与重塑画面">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M8 7l-5 5 5 5M16 7l5 5-5 5"></path>
              </svg>
            </button>

            <span class="badge-before">BEFORE · 母版</span>
            <span class="badge-after">AFTER · 重塑</span>
          </div>
        </div>

        <!-- 参数与技术岛 -->
        <div class="technique-island">
          <span style="font-family: var(--font-mono); color: #7dd3fc;" id="techniqueName">
            Spectral Color Splitting
          </span>
        </div>

        <!-- 作品微轨 -->
        <div class="project-track" id="projectTrack">
          <!-- 缩略图 -->
        </div>

      </section>

    </div>
  </main>

  <script>
    /* ==========================================================================
       Chrono-Lens 重·构 先锋实验大厅逻辑
       ========================================================================== */

    const DEFAULT_STUDIO_DATA = {
      id: "hall_05_studio",
      nameZh: "重·构",
      albums: [
        {
          albumId: "project_05_cyber",
          titleZh: "赛博解构 · 雪谷光谱与星汉裂变",
          curation: "以正午高动态实拍母版为基准，在真实光学原片与超现实光谱重塑之间展开双向无级对比。",
          coverImage: "./assets/artworks/cover-05-avantgarde-pop-dark.svg",
          works: [
            {
              workId: "studio_01_neon_crossing",
              titleZh: "富士云海 · 赛博星汉裂变",
              beforeMediaUrl: "./assets/images/diurnal/fuji_noon.jpg",
              afterMediaUrl: "./assets/images/diurnal/fuji_night.jpg",
              afterFilter: "contrast(1.22) saturate(1.65) hue-rotate(-24deg)",
              technique: "Spectral Color Splitting & High-Dynamic Grain"
            },
            {
              workId: "studio_03_surreal_sky",
              titleZh: "雪谷峡湾 · 冷青品红矩阵",
              beforeMediaUrl: "./data/media/fjord_cut_02_ridge.jpg",
              afterMediaUrl: "./data/media/fjord_cut_02_ridge.jpg",
              afterFilter: "contrast(1.26) saturate(1.85) hue-rotate(-42deg)",
              technique: "Bichromatic Prism Refraction & Chromatic Matrix"
            }
          ]
        },
        {
          albumId: "project_05_vintage",
          titleZh: "复古重塑 · 大画幅褪色与银盐质感",
          curation: "模拟20世纪初柯达成色剂老化与暗角衰减，探索历史画面的时光质感。",
          coverImage: "./assets/artworks/album-05-vintage-patina.svg",
          works: [
            {
              workId: "studio_02_patina_facade",
              titleZh: "林冠银盐成色衰减",
              beforeMediaUrl: "./assets/images/diurnal/canopy_noon.jpg",
              afterMediaUrl: "./assets/images/diurnal/canopy_dusk.jpg",
              afterFilter: "sepia(0.68) contrast(1.14) brightness(0.92) saturate(0.84)",
              technique: "Century-Old Dye Coupler Decay & Vignette Falloff"
            }
          ]
        }
      ]
    };

    let moduleData = DEFAULT_STUDIO_DATA;
    let currentAlbum = null;
    let currentWorkIdx = 0;
    let currentSplitPercent = 50;

    // DOM
    const studioSalonView = document.getElementById("studioSalonView");
    const showcaseView = document.getElementById("showcaseView");
    const projectGrid = document.getElementById("projectGrid");
    const studioDotsNav = document.getElementById("studioDotsNav");
    const btnStudioTopBack = document.getElementById("btnStudioTopBack");
    const activeProjectTitle = document.getElementById("activeProjectTitle");

    const splitViewport = document.getElementById("splitViewport");
    const beforeClipBox = document.getElementById("beforeClipBox");
    const splitDividerLine = document.getElementById("splitDividerLine");
    const sliderHandle = document.getElementById("sliderHandle");
    const imgBefore = document.getElementById("imgBefore");
    const imgAfter = document.getElementById("imgAfter");
    const techniqueName = document.getElementById("techniqueName");
    const projectTrack = document.getElementById("projectTrack");

    // 1. 初始化
    async function init() {
      try {
        const res = await fetch("./data/catalog.json?v=v29", { cache: "no-cache" });
        if (res.ok) {
          const list = await res.json();
          const target = list.find(item => item.id === "hall_05_studio");
          if (target && target.albums && target.albums.length > 0) {
            moduleData = target;
          }
        }
      } catch (e) {
        console.warn("使用内置先锋实验数据", e);
      }
      renderProjectGrid();
      bindSliderEvents();
    }

    // 2. 渲染卡片
    function renderProjectGrid() {
      projectGrid.innerHTML = "";
      if (studioDotsNav) studioDotsNav.innerHTML = "";

      moduleData.albums.forEach((album, idx) => {
        const card = document.createElement("div");
        card.className = "project-card";
        card.setAttribute("role", "button");
        card.setAttribute("tabindex", "0");
        card.innerHTML = `
          <div class="project-cover-box">
            <span class="project-badge-top">AVANT-GARDE LAB</span>
            <span class="project-count-tag">${(album.works && album.works.length) || album.worksCount || 2} EXP</span>
            <img src="${album.coverImage}" alt="${album.titleZh}" class="project-cover-img" loading="lazy" />
          </div>
          <div class="project-info">
            <h3 class="project-title">${album.titleZh}</h3>
            <p class="project-curation">${album.curation}</p>
          </div>
        `;
        card.addEventListener("click", () => openShowcase(album));
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openShowcase(album);
          }
        });
        projectGrid.appendChild(card);

        if (studioDotsNav) {
          const dotBtn = document.createElement("button");
          dotBtn.type = "button";
          dotBtn.className = `studio-dot-btn ${idx === 0 ? "is-active" : ""}`;
          dotBtn.setAttribute("aria-label", `实验单元 ${idx + 1}`);
          dotBtn.innerHTML = `<span class="studio-dot-core"></span>`;
          dotBtn.addEventListener("click", () => {
            const targetCard = projectGrid.children[idx];
            if (targetCard) {
              projectGrid.scrollTo({ left: targetCard.offsetLeft - projectGrid.offsetLeft, behavior: "smooth" });
            }
          });
          studioDotsNav.appendChild(dotBtn);
        }
      });

      projectGrid.addEventListener("scroll", () => {
        if (!studioDotsNav || !projectGrid.clientWidth) return;
        const activeIdx = Math.round(projectGrid.scrollLeft / projectGrid.clientWidth);
        Array.from(studioDotsNav.children).forEach((btn, i) => {
          btn.classList.toggle("is-active", i === activeIdx);
        });
      }, { passive: true });
    }

    // 3. 打开实验展陈
    function openShowcase(album) {
      currentAlbum = album;
      currentWorkIdx = 0;
      studioSalonView.classList.add("view-hidden");
      showcaseView.classList.remove("view-hidden");
      activeProjectTitle.textContent = album.titleZh;

      renderProjectTrack();
      loadExperiment(0);
      requestAnimationFrame(() => setSplitPosition(50));
    }

    if (btnStudioTopBack) {
      btnStudioTopBack.addEventListener("click", (e) => {
        if (!showcaseView.classList.contains("view-hidden")) {
          e.preventDefault();
          showcaseView.classList.add("view-hidden");
          studioSalonView.classList.remove("view-hidden");
        }
      });
    }

    // 4. 渲染微轨
    function renderProjectTrack() {
      projectTrack.innerHTML = "";
      if (!currentAlbum || !currentAlbum.works) return;

      currentAlbum.works.forEach((w, idx) => {
        const thumb = document.createElement("button");
        thumb.type = "button";
        thumb.className = `work-thumb ${idx === currentWorkIdx ? "active" : ""}`;
        thumb.setAttribute("aria-label", w.titleZh || `实验样本 ${idx + 1}`);
        thumb.innerHTML = `<img src="${w.beforeMediaUrl}" alt="${w.titleZh}" />`;
        thumb.addEventListener("click", () => loadExperiment(idx));
        projectTrack.appendChild(thumb);
      });
    }

    // 5. 加载实验
    function loadExperiment(idx) {
      if (!currentAlbum || !currentAlbum.works || !currentAlbum.works[idx]) return;
      currentWorkIdx = idx;
      const w = currentAlbum.works[idx];

      imgBefore.src = w.beforeMediaUrl;
      imgAfter.src = w.afterMediaUrl;
      imgAfter.style.filter = w.afterFilter || "saturate(1.35) contrast(1.1)";
      techniqueName.textContent = w.technique || "Spectral Color Splitting";

      const thumbs = projectTrack.querySelectorAll(".work-thumb");
      thumbs.forEach((t, i) => t.classList.toggle("active", i === idx));
    }

    // 6. 双向无级擦除对比滑动条 (纯 GPU clip-path + translate3d 驱动)
    let isDragging = false;

    function setSplitPosition(percent) {
      const clamped = Math.max(0, Math.min(100, percent));
      currentSplitPercent = clamped;
      beforeClipBox.style.clipPath = `inset(0 ${100 - clamped}% 0 0)`;
      const widthPx = splitViewport.clientWidth || 0;
      const xPx = (widthPx * clamped) / 100;
      splitDividerLine.style.transform = `translate3d(${xPx - 1}px, 0, 0)`;
      sliderHandle.style.transform = `translate3d(${xPx - 22}px, -50%, 0)`;
    }

    function handleMove(clientX) {
      const rect = splitViewport.getBoundingClientRect();
      if (!rect.width) return;
      const x = clientX - rect.left;
      const percent = (x / rect.width) * 100;
      setSplitPosition(percent);
    }

    function bindSliderEvents() {
      splitViewport.addEventListener("pointerdown", (e) => {
        isDragging = true;
        handleMove(e.clientX);
        try { splitViewport.setPointerCapture(e.pointerId); } catch (err) {}
      });

      splitViewport.addEventListener("pointermove", (e) => {
        if (!isDragging) return;
        handleMove(e.clientX);
      });

      function endDrag(e) {
        if (!isDragging) return;
        isDragging = false;
        try { splitViewport.releasePointerCapture(e.pointerId); } catch (err) {}
      }

      splitViewport.addEventListener("pointerup", endDrag);
      splitViewport.addEventListener("pointercancel", endDrag);

      sliderHandle.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") {
          e.preventDefault();
          setSplitPosition(currentSplitPercent - 5);
        } else if (e.key === "ArrowRight") {
          e.preventDefault();
          setSplitPosition(currentSplitPercent + 5);
        }
      });

      window.addEventListener("resize", () => {
        if (!showcaseView.classList.contains("view-hidden")) {
          setSplitPosition(currentSplitPercent);
        }
      });
    }

    // 启动
    window.addEventListener("DOMContentLoaded", () => {
      init();
      if (window.ChronoSoundscape) {
        window.ChronoSoundscape.init({
          mode: "studio",
          btnId: "btnStudioSound",
          dotId: "soundDotStudio"
        });
      }
    });
  </script>
</body>
</html>
